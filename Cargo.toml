[workspace]
resolver = "2"
members = ["crate", "crate/dcl-contents", "crate/abgen-native", "lambda"]
exclude = [
    "crate/third_party/draco_decoder",
    "crate/third_party/crunch",
    "crate/third_party/libjpeg9c",
    "crate/kernel-ptx",
    "crate/abgen-wasm",
    "crate/abgen-node",
]

[workspace.package]
version = "0.17.1"

# Fat LTO buys kernel runtime; panic stays "unwind" — catch_unwind is
# the per-asset isolation and must keep working.
[profile.release]
lto = "fat"
codegen-units = 1

# CI/local test profile: same semantics, no fat-LTO link cost.
[profile.checkfast]
inherits = "release"
lto = "off"
codegen-units = 16
