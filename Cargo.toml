[workspace]
resolver = "2"
members = ["crate", "crate/dcl-contents", "crate/abgen-native", "lambda"]
exclude = [
    "crate/third_party/draco_decoder",
    "crate/third_party/crunch",
    "crate/third_party/libjpeg9c",
    "crate/kernel-ptx",
    "crate/abgen-wasm",
    "crate/abgen-node",
]

[workspace.package]
version = "0.17.10"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.checkfast]
inherits = "release"
lto = "off"
codegen-units = 16
