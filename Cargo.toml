[workspace]
resolver = "2"
members = ["crate", "crate/dcl-contents", "crate/abgen-native", "lambda"]
exclude = [
    "crate/third_party/draco_decoder",
    "crate/third_party/crunch",
    "crate/third_party/libjpeg9c",
    "crate/kernel-ptx",
    "crate/abgen-wasm",
    "crate/abgen-node",
]

[workspace.package]
version = "0.17.1"

# Whole-program LTO and a single codegen unit: the hot paths cross crate
# boundaries (image/gltf decode -> abgen kernels -> lz4 pack), and the
# per-texel kernels benefit from cross-CGU inlining. Costs link time on
# every target, buys runtime. panic stays "unwind": catch_unwind is
# per-asset isolation (glbscan, regen, bvwebgpu) and must keep working.
[profile.release]
lto = "fat"
codegen-units = 1
