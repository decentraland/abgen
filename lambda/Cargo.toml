[package]
name = "abgen-lambda"
version.workspace = true
edition = "2021"
description = "Single-binary asset-bundle conversion pipeline for AWS Lambda: deployment event in, converted bundles + manifest to S3, registry notification out."
license = "Apache-2.0"

[[bin]]
name = "abgen-lambda"
path = "src/main.rs"

[dependencies]
abgen = { path = "../crate", default-features = false }
anyhow = "1"
metrics = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
ureq = "3"
