<!DOCTYPE html>
<meta charset="utf-8">
<title>gputest: running</title>
<h1>WebGPU encode parity test</h1>
<p>Converts the same files twice — CPU-forced and GPU-enabled — and compares
every output bundle byte-for-byte. Watch <code>#log</code>; the title flips
to PASS/FAIL.</p>
<pre id="log"></pre>
<script type="module">
import { runConvert } from './pool.js';

const logEl = document.getElementById('log');
const log = (s) => { logEl.textContent += s + '\n'; };
const sha256 = async (buf) =>
  [...new Uint8Array(await crypto.subtle.digest('SHA-256', buf))]
    .map((b) => b.toString(16).padStart(2, '0')).join('');

// Small committed fixtures (jpeg + normal-map texture lanes). Drop any extra
// .glb into test-assets/ and add it here for a heavier run.
const ASSETS = ['jpeg-quad.glb', 'normal-quad.glb'];

async function convert(gpu, files, module) {
  const outputs = new Map();
  let gpuNote = '';
  const t0 = performance.now();
  const done = await new Promise((resolve) => {
    runConvert({
      module, files, platform: 'mac', entityType: 'scene', magenta: false, lod: false, gpu,
    }, (m) => {
      if (m.type === 'event' && m.data && m.data.ev === 'note' && /WebGPU/.test(m.data.msg)) {
        gpuNote = m.data.msg;
        log(`  [${gpu ? 'gpu' : 'cpu'}] ${m.data.msg}`);
      }
      if (m.type === 'output') outputs.set(m.name, m.data);
      if (m.type === 'done') resolve(m);
    });
  });
  const wall = ((performance.now() - t0) / 1000).toFixed(2);
  const hashes = new Map();
  for (const [name, data] of [...outputs.entries()].sort()) {
    hashes.set(name, await sha256(data));
  }
  return { code: done.code, wall, hashes, gpuNote };
}

try {
  log(`crossOriginIsolated=${crossOriginIsolated} webgpu=${!!navigator.gpu} hc=${navigator.hardwareConcurrency}`);
  const files = await Promise.all(ASSETS.map(async (n) => ({
    name: n, data: await (await fetch(`test-assets/${n}`)).arrayBuffer(),
  })));
  const module = WebAssembly.compileStreaming(fetch('abgen_wasm.wasm'));
  log('--- CPU pass ---');
  const cpu = await convert(false, files.map((f) => ({ name: f.name, data: f.data.slice(0) })), module);
  log(`cpu: exit=${cpu.code} wall=${cpu.wall}s bundles=${cpu.hashes.size}`);
  log('--- GPU pass ---');
  const gpu = await convert(true, files.map((f) => ({ name: f.name, data: f.data.slice(0) })), module);
  log(`gpu: exit=${gpu.code} wall=${gpu.wall}s bundles=${gpu.hashes.size} note="${gpu.gpuNote}"`);
  let pass = cpu.code === 0 && gpu.code === 0 && cpu.hashes.size === gpu.hashes.size
    && cpu.hashes.size > 0 && /WebGPU encode: ON/.test(gpu.gpuNote);
  for (const [name, h] of cpu.hashes) {
    const g = gpu.hashes.get(name);
    const ok = g === h;
    log(`${ok ? 'MATCH' : 'DIFFER'} ${name}\n  cpu ${h}\n  gpu ${g || '(missing)'}`);
    if (!ok) pass = false;
  }
  document.title = pass ? 'gputest: PASS' : 'gputest: FAIL';
  log(pass ? 'PASS: WebGPU output byte-identical to CPU' : 'FAIL');
} catch (e) {
  document.title = 'gputest: FAIL';
  log('FATAL: ' + (e && e.stack || e));
}
</script>
