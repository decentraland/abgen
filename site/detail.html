<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AB PARITY — pair detail</title>
<style>
:root{--bg:#0d0c10;--panel:#16151b;--panel2:#1c1b22;--line:#2a2833;--ink:#e6e2f4;--dim:#9c96b2;
 --faint:#6f6a85;--identical:#3ddc84;--imperceptible:#38b6c9;--visible:#e8a13c;--stub:#a78bda;
 --structural:#5f74e0;--fail:#e8425f;--accent:#ff6a2b;font-size:15px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
 font-family:"Berkeley Mono","IBM Plex Mono","JetBrains Mono",ui-monospace,Menlo,monospace}
header{padding:12px 20px 0;border-bottom:1px solid var(--line);position:sticky;top:0;background:#121117;z-index:10}
h1{margin:0;font-size:14px;letter-spacing:.25em;text-transform:uppercase}
h1 a{color:var(--accent);text-decoration:none}
.sub{color:var(--dim);font-size:11px;margin-top:6px;line-height:1.8;word-break:break-all}
.metrics{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;font-size:11px;align-items:center}
.metrics .m{border:1px solid var(--line);border-radius:2px;padding:2px 10px;background:var(--panel2)}
.metrics .m b{color:var(--ink)}
.badge{display:inline-block;border-radius:2px;padding:1px 8px;font-size:11px;letter-spacing:.1em;
 text-transform:uppercase;font-weight:700;color:var(--bg)}
.b-identical{background:var(--identical)}.b-imperceptible{background:var(--imperceptible)}
.b-visible{background:var(--visible)}.b-stub{background:var(--stub)}
.b-structural{background:var(--structural)}.b-fail{background:var(--fail)}
/* tab bar doubles as the diagnosis summary */
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0;padding-bottom:10px}
nav button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;
 border:1px solid var(--line);border-radius:3px 3px 0 0;padding:6px 14px;font-size:11px;
 letter-spacing:.14em;text-transform:uppercase;color:var(--dim);background:var(--panel)}
nav button.on{color:var(--ink);background:var(--panel2);border-color:var(--accent)}
.chip{font-size:10px;letter-spacing:.04em;border-radius:2px;padding:1px 7px;font-weight:700;text-transform:none}
.c-ok{background:rgba(61,220,132,.16);color:var(--identical);border:1px solid var(--identical)}
.c-diff{background:rgba(232,161,60,.14);color:var(--visible);border:1px solid var(--visible)}
.c-bad{background:rgba(232,66,95,.14);color:var(--fail);border:1px solid var(--fail)}
.c-na{background:var(--panel2);color:var(--faint);border:1px solid var(--line)}
main{padding:16px 20px 120px;max-width:1600px}
.panel{display:none}.panel.on{display:block}
.azrow{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.cellbox{width:330px}
.cellbox canvas{width:330px;height:330px;background:#111;border:1px solid var(--line);display:block;cursor:zoom-in}
.cap{font-size:11px;color:var(--dim);letter-spacing:.14em;text-transform:uppercase;padding:3px 0}
table{border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:4px 10px;text-align:right}
th{color:var(--dim);font-weight:400;letter-spacing:.1em;text-transform:uppercase;font-size:10px}
td:first-child,th:first-child{text-align:left}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols>div{min-width:0}
.uline{font-size:12.5px;line-height:1.7;padding:2px 8px;border-left:2px solid var(--line);
 margin:2px 0;word-break:break-all;white-space:pre-wrap;background:#0a090d}
.fu{color:#ff9d9d;background:rgba(232,66,95,.16);padding:0 3px;border-radius:2px}
.fb{color:#8de6b0;background:rgba(61,220,132,.13);padding:0 3px;border-radius:2px}
.arr{color:var(--faint);padding:0 2px}
.usummary{font-size:11px;color:var(--dim);margin:8px 0}
.tree{font-size:13px;line-height:1.9}
.tree details{border:none;background:none;margin:0 0 0 14px}
.tree summary{padding:2px 6px;letter-spacing:0;text-transform:none;font-size:12px;display:list-item;color:var(--ink)}
.tnode{margin-left:34px;padding:1px 6px;color:var(--dim);word-break:break-all}
.tnode b{color:var(--ink);font-weight:400}
.tok{color:var(--identical)} .tchg{color:var(--visible)} .tdel{color:#ff9d9d} .tadd{color:#8de6b0}
.cnt{color:var(--faint)}
.pin{border-left:2px solid var(--accent);margin:6px 0;padding:4px 10px;background:#0a090d;word-break:break-all;font-size:12px;line-height:1.8}
.pin .cap{display:inline;padding-right:8px}
pre{background:#0a090d;border:1px solid var(--line);padding:10px;font-size:12px;line-height:1.5;
 overflow:auto;max-height:56vh;white-space:pre;color:var(--ink);margin:0}
pre .d{background:rgba(232,66,95,.25)}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--dim);
 padding:3px 10px;font:inherit;font-size:11px;letter-spacing:.1em;text-transform:uppercase;border-radius:2px}
.btn.on,.btn:hover{color:var(--ink);border-color:var(--accent)}
.note{color:var(--faint);font-size:12px;line-height:1.7}
input[type=text]{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
 padding:3px 8px;font:inherit;font-size:11px;width:120px}
.hist{display:flex;align-items:flex-end;gap:2px;height:60px;margin-top:4px}
.hist div{width:24px;background:var(--fail);opacity:.85;min-height:1px}
.toolrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
#lb{position:fixed;inset:0;z-index:100;background:rgba(8,7,10,.97);display:none;align-items:center;justify-content:center}
#lb.open{display:flex}#lb img{max-width:92vw;max-height:92vh;border:1px solid var(--line);background:#111}

@media (max-width:640px){
  :root{font-size:14px}
  header{padding:10px 12px 0}
  h1{font-size:13px;letter-spacing:.15em}
  main{padding:14px 12px 100px}
  nav{gap:5px}
  nav button{padding:6px 10px;font-size:11px}
  .metrics{gap:8px}
  /* comparison images fill the width and stay square instead of a fixed 330px */
  .azrow{gap:10px}
  .cellbox{width:100%;max-width:min(330px,88vw)}
  .cellbox canvas{width:100%;height:auto;aspect-ratio:1}
  /* single-column diff + horizontally-scrollable tables so nothing overflows */
  .cols{grid-template-columns:1fr;gap:10px}
  table{display:block;overflow-x:auto;max-width:100%}
  input[type=text]{font-size:16px;width:100%;max-width:220px}
  pre{max-height:64vh}
}
</style>
</head>
<body>
<header>
  <h1><a href="index.html" id="backlink">AB·PARITY</a> / <span id="tpair">…</span></h1>
  <div class="sub" id="sub">loading…</div>
  <div class="metrics" id="mrow"></div>
  <nav id="tabs">
    <button data-t="renders" class="on">renders <span class="chip c-na" id="ch-renders">…</span></button>
    <button data-t="hier">hierarchy <span class="chip c-na" id="ch-hier">…</span></button>
    <button data-t="struct">structure <span class="chip c-na" id="ch-struct">…</span></button>
    <button data-t="tex">textures <span class="chip c-na" id="ch-tex">…</span></button>
    <button data-t="mat">materials <span class="chip c-na" id="ch-mat">…</span></button>
    <button data-t="bytes">bytes <span class="chip c-na" id="ch-bytes">…</span></button>
  </nav>
</header>
<main>
  <div class="panel on" id="p-renders">
    <div class="toolrow"><button class="btn" id="zoomBtn">zoom object</button>
      <span class="note">zoom preference persists · click any image to enlarge</span></div>
    <div id="renders" class="note">computing…</div></div>
  <div class="panel" id="p-hier"><div id="hier" class="note">loading…</div></div>
  <div class="panel" id="p-struct"><div id="struct" class="note">loading…</div></div>
  <div class="panel" id="p-tex"><div id="tex" class="note">loading…</div></div>
  <div class="panel" id="p-mat"><div id="mat" class="note">loading…</div></div>
  <div class="panel" id="p-bytes"><div id="bytes" class="note">loading…</div></div>
</main>
<div id="lb" onclick="this.classList.remove('open')"><img id="lbimg"></div>
<script>
const P=new URLSearchParams(location.search);
const run=P.get('run')||'',plat=P.get('plat')||'',pair=P.get('pair');
const API=`run=${encodeURIComponent(run)}&plat=${encodeURIComponent(plat)}&pair=${encodeURIComponent(pair)}`;
let ROW=null,LOC=null,AZCACHE={};
let LBLU='upstream',LBLO='ours';                           // column captions from run config
let ZOOM=localStorage.getItem('abp.zoom')!=='off';        // persisted preferences
let LOCKSCROLL=localStorage.getItem('abp.lock')!=='off';
document.getElementById('tpair').textContent=`${pair} · ${run} · ${plat}`;
document.getElementById('backlink').href=`index.html?run=${encodeURIComponent(run)}&plat=${encodeURIComponent(plat)}`;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const $=id=>document.getElementById(id);
function chip(id,cls,text){const c=$(id);c.className='chip '+cls;c.textContent=text;}
function enlarge(src){$('lbimg').src=src;$('lb').classList.add('open');}

/* tabs — the bar itself is the diagnosis summary (chips fill in async) */
const TABS=[...document.querySelectorAll('#tabs button')];
function setTab(t,push){
  TABS.forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+t));
  localStorage.setItem('abp.tab',t);
  if(push){const u=new URL(location);u.searchParams.set('tab',t);history.pushState({tab:t},'',u);}
}
TABS.forEach(b=>b.onclick=()=>setTab(b.dataset.t,true));
window.addEventListener('popstate',e=>setTab((e.state&&e.state.tab)||new URL(location).searchParams.get('tab')||'renders',false));
setTab(P.get('tab')||localStorage.getItem('abp.tab')||'renders',false);

/* synchronized scrolling for side-by-side panes */
function linkScroll(a,b,holder){
  let mute=false;
  const mirror=(src,dst)=>()=>{if(!LOCKSCROLL||mute)return;mute=true;
    dst.scrollTop=src.scrollTop;dst.scrollLeft=src.scrollLeft;requestAnimationFrame(()=>mute=false);};
  a.addEventListener('scroll',mirror(a,b));b.addEventListener('scroll',mirror(b,a));
  const btn=document.createElement('button');
  btn.className='btn'+(LOCKSCROLL?' on':'');btn.textContent=LOCKSCROLL?'🔒 scroll locked':'🔓 scroll free';
  btn.onclick=()=>{LOCKSCROLL=!LOCKSCROLL;localStorage.setItem('abp.lock',LOCKSCROLL?'on':'off');
    document.querySelectorAll('.lockbtn').forEach(x=>{x.classList.toggle('on',LOCKSCROLL);
      x.textContent=LOCKSCROLL?'🔒 scroll locked':'🔓 scroll free';});};
  btn.classList.add('lockbtn');
  holder.prepend(btn);
}

const locateHelp=()=>`<p class="note">could not resolve the on-disk bundle file for
  ${!LOC.up.bundle?`the <b>${esc(LBLU)}</b> side`:''}${!LOC.up.bundle&&!LOC.ab.bundle?' and ':''}
  ${!LOC.ab.bundle?`the <b>${esc(LBLO)}</b> side`:''} — expected run-relative
  <code>ours_path</code>/<code>upstream_path</code> in the run's analysis/pairs.jsonl
  pointing inside the run dir. Raw resolver: <a style="color:var(--accent)" target="_blank"
  href="/api/locate?${API}">/api/locate</a></p>`;

async function boot(){
  const r=await fetch(`/api/row?${API}`).then(r=>r.json());
  if(!r.row){$('sub').textContent='row not found in this run’s data';return;}
  ROW=r.row;
  if(!ROW.ours&&ROW.abgen)ROW.ours=ROW.abgen; // legacy side name
  const L=r.labels||{};LBLU=L.upstream||LBLU;LBLO=L.ours||LBLO;
  const T=Object.assign({imperceptible_ppm:200,amnesty:{delta_gt:8,ppm:200}},r.thresholds||{});
  const tags=(ROW.tags||[]).join(',');
  $('sub').innerHTML=`${ROW.kind} · ${r.entity} · bundle ${ROW.bundle} · up ${ROW.upVersion||'?'}${tags?' · tags '+esc(tags):''}${ROW.note?' · '+esc(ROW.note):''}`;
  $('mrow').innerHTML=`<span class="badge b-${ROW.label}">${ROW.label}</span>
    <span class="m">raw ppm <b>${ROW.ppm!=null?ROW.ppm.toLocaleString():'—'}</b></span>
    <span class="m">Δ>${T.amnesty.delta_gt} ppm <b style="color:${ROW.ppm8!=null&&ROW.ppm8<=T.amnesty.ppm?'var(--identical)':'var(--visible)'}">${ROW.ppm8!=null?ROW.ppm8.toLocaleString():'—'}</b></span>
    <span class="m">maxΔ <b>${ROW.maxd!=null?ROW.maxd:'—'}</b></span>
    <span class="m">bytes <b>${esc(ROW.prov||'—')}</b></span>
    <span class="note">rule: identical=0px · imperceptible ≤${T.imperceptible_ppm}ppm (or Δ>${T.amnesty.delta_gt} ≤${T.amnesty.ppm}ppm amnesty) · visible=above</span>`;
  $('zoomBtn').classList.toggle('on',ZOOM);
  LOC=await fetch(`/api/locate?${API}`).then(r=>r.json());
  // everything loads NOW, in parallel — tabs only switch visibility
  renderShots();
  loadHier();loadStruct();loadTextures();
  loadDump('mat','mat','ch-mat');loadBytes();
}
$('zoomBtn').onclick=()=>{ZOOM=!ZOOM;localStorage.setItem('abp.zoom',ZOOM?'on':'off');
  $('zoomBtn').classList.toggle('on',ZOOM);AZCACHE={};renderShots();};

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;
  i.src=`/r/${encodeURIComponent(run)}/`+src;});}
async function azData(az){
  if(AZCACHE[az])return AZCACHE[az];
  const[ui,ai]=await Promise.all([loadImg(ROW.up[az%ROW.up.length]),loadImg(ROW.ours[az%ROW.ours.length])]);
  const W=Math.max(ui.naturalWidth,ai.naturalWidth),H=Math.max(ui.naturalHeight,ai.naturalHeight);
  const natA=ui.naturalWidth+'×'+ui.naturalHeight,natB=ai.naturalWidth+'×'+ai.naturalHeight;
  const scaled=natA!==natB; // stretch both to the max grid so the diff is aligned
  const cv=s=>{const c=document.createElement('canvas');c.width=W;c.height=H;
    const g=c.getContext('2d',{willReadFrequently:true});
    g.imageSmoothingEnabled=false;g.drawImage(s,0,0,W,H);return g;};
  const ug=cv(ui),ag=cv(ai);
  const ud=ug.getImageData(0,0,W,H).data,ad=ag.getImageData(0,0,W,H).data;
  const corner=(x,y)=>{const i=(y*W+x)*4;return[ud[i],ud[i+1],ud[i+2]];};
  const cs=[corner(2,2),corner(W-3,2),corner(2,H-3),corner(W-3,H-3)];
  const bg=[0,1,2].map(k=>Math.round(cs.reduce((s,c)=>s+c[k],0)/4));
  let x0=W,y0=H,x1=-1,y1=-1,px=0,px8=0,px32=0,maxd=0,sum=0;
  const hist=[0,0,0,0,0,0,0,0];
  const heat=new Uint8ClampedArray(W*H*4);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const i=(y*W+x)*4;
    const du=Math.max(Math.abs(ud[i]-bg[0]),Math.abs(ud[i+1]-bg[1]),Math.abs(ud[i+2]-bg[2]));
    const da=Math.max(Math.abs(ad[i]-bg[0]),Math.abs(ad[i+1]-bg[1]),Math.abs(ad[i+2]-bg[2]));
    if(du>14||da>14){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
    const d=Math.max(Math.abs(ud[i]-ad[i]),Math.abs(ud[i+1]-ad[i+1]),Math.abs(ad[i+2]-ud[i+2]));
    if(d>0){px++;sum+=d;if(d>8)px8++;if(d>32)px32++;if(d>maxd)maxd=d;
      hist[d<=2?0:d<=4?1:d<=8?2:d<=16?3:d<=32?4:d<=64?5:d<=128?6:7]++;}
    heat[i]=Math.min(255,d*8);heat[i+3]=255;
  }
  if(x1<0){x0=0;y0=0;x1=W-1;y1=H-1;}
  const pw=Math.max(24,Math.round((x1-x0)*.06)),ph=Math.max(24,Math.round((y1-y0)*.06));
  x0=Math.max(0,x0-pw);y0=Math.max(0,y0-ph);x1=Math.min(W-1,x1+pw);y1=Math.min(H-1,y1+ph);
  const heatCv=document.createElement('canvas');heatCv.width=W;heatCv.height=H;
  heatCv.getContext('2d').putImageData(new ImageData(heat,W,H),0,0);
  const objPx=(x1-x0+1)*(y1-y0+1);
  const out={up:ug.canvas,ab:ag.canvas,heat:heatCv,bbox:[x0,y0,x1-x0+1,y1-y0+1],W,H,natA,natB,scaled,
    px,px8,px32,maxd,mean:px?(sum/px).toFixed(1):0,hist,
    ppm:Math.round(px*1e6/(W*H)),ppm8:Math.round(px8*1e6/(W*H)),objPpm:Math.round(px*1e6/objPx)};
  AZCACHE[az]=out;return out;
}
function paint(c,src,bbox){
  c.width=660;c.height=660;const g=c.getContext('2d');
  g.fillStyle='#111';g.fillRect(0,0,660,660);
  let sx=0,sy=0,sw=src.width,sh=src.height;
  if(ZOOM&&bbox)[sx,sy,sw,sh]=bbox;
  const sc=Math.min(660/sw,660/sh);
  g.drawImage(src,sx,sy,sw,sh,(660-sw*sc)/2,(660-sh*sc)/2,sw*sc,sh*sc);
}
async function renderShots(){
  const holder=$('renders');
  if(!ROW.up||!ROW.ours){holder.innerHTML='<p class="note">one side has no renders — see header note</p>';chip('ch-renders','c-na','no renders');return;}
  holder.textContent='';
  const nAz=Math.max(1,ROW.up.length); // follows the run's azimuth count, not a baked 3
  let worst8=0;
  for(let az=0;az<nAz;az++){
    const res=await azData(az);
    worst8=Math.max(worst8,res.ppm8);
    const div=document.createElement('div');
    const histHtml=res.hist.map((v,i)=>{
      const labels=['1-2','3-4','5-8','9-16','17-32','33-64','65-128','129+'];
      const h=v?Math.max(2,Math.round(56*Math.log10(1+v)/Math.log10(1+Math.max(...res.hist,1)))):0;
      return `<div title="Δ${labels[i]}: ${v.toLocaleString()} px" style="height:${h}px"></div>`;}).join('');
    div.innerHTML=`<div class="cap">azimuth ${az} — ${res.px.toLocaleString()} px (${res.ppm.toLocaleString()}ppm) ·
      <b>Δ>8: ${res.px8.toLocaleString()} px (${res.ppm8.toLocaleString()}ppm)</b> ·
      Δ>32: ${res.px32.toLocaleString()} · maxΔ ${res.maxd} · meanΔ ${res.mean} · object ${res.objPpm.toLocaleString()}ppm</div>
      <div class="azrow">
        <div class="cellbox"><canvas class="c-up"></canvas><div class="cap">${esc(LBLU)}</div></div>
        <div class="cellbox"><canvas class="c-ab"></canvas><div class="cap">${esc(LBLO)}</div></div>
        <div class="cellbox"><canvas class="c-heat"></canvas><div class="cap">red-diff ×8</div></div>
        <div style="max-width:250px"><div class="cap">amplitude histogram</div><div class="hist">${histHtml}</div>
          <div class="cap" style="margin-top:2px">Δ per bar: 1-2 · 3-4 · 5-8 · 9-16 · 17-32 · 33-64 · 65-128 · 129+</div>
          <div class="note" style="margin-top:4px">Δ = how different a pixel is (0–255/channel).
          LEFT bars = too small to see (Δ≤8 ≈ noise floor); RIGHT bars = strong visible change. Log heights; hover for counts.</div></div>
      </div>`;
    holder.appendChild(div);
    paint(div.querySelector('.c-up'),res.up,res.bbox);
    paint(div.querySelector('.c-ab'),res.ab,res.bbox);
    paint(div.querySelector('.c-heat'),res.heat,res.bbox);
    for(const c of div.querySelectorAll('canvas'))c.onclick=()=>enlarge(c.toDataURL());
  }
  chip('ch-renders',worst8<=200?'c-ok':'c-diff',worst8<=200?`clean · Δ>8 ${worst8}ppm`:`Δ>8 ${worst8.toLocaleString()}ppm`);
}

function parseRecords(text){
  const recs=[];
  for(const raw of text.split('\n')){
    const line=raw.trim();
    if(!line||line.startsWith('== '))continue;
    const toks=smartTokens(line);
    const kv=[],head=[];
    for(const t of toks){const eq=t.indexOf('=');
      if(eq>0&&!t.startsWith('"'))kv.push([t.slice(0,eq),t.slice(eq+1)]);else head.push(t);}
    recs.push({head:head.join(' '),kv:Object.fromEntries(kv),order:kv.map(x=>x[0])});
  }
  return recs;
}
function recKey(r){
  if(r.kv.class!=null)return `c${r.kv.class}|${volNorm(r.kv.name||'')}`;
  return volNorm(r.head);
}
function expandValue(k,v){
  // pretty-print embedded JSON / lists into sub-lines
  const un=String(v).replace(/\\"/g,'"');
  if(k==='script_head'){
    const body=un.replace(/^"/,'').replace(/"$/,'');
    const out=[];
    const push=(kk,vv)=>out.push(`    ${kk}: ${vv}`);
    const g=(re,name)=>{const m=body.match(re);if(m)push(name,m[1]);};
    g(/"timestamp":(\d+)/,'timestamp');g(/"version":"([^"]*)"/,'version');
    const dep=body.match(/"dependencies":\[([^\]]*)\]?/);if(dep)push('dependencies','['+dep[1]+']');
    const ma=body.match(/"mainAsset":"([^"]*)/);if(ma)push('mainAsset',ma[1]===''?'""':ma[1]);
    return out.length?out:[`    ${un}`];
  }
  const listm=un.match(/^Some\(\[(.*)\]\)$/s);
  if(listm!=null){
    if(!listm[1].trim())return [`  ${k} = []`.replace('  ','  ')].slice(0,0).concat([`  ${k} = []`]).slice(-1);
    try{const arr=JSON.parse('['+listm[1]+']');
      return [`  ${k}:`].concat(arr.map(x=>`    - ${x}`));}catch(e){}
  }
  return [`  ${k} = ${un}`];
}
function recLines(r){
  const lines=[];
  if(r.kv.class!=null){
    lines.push(`▸ ${clsName(+r.kv.class)} (class=${r.kv.class})`);
    const keys=r.order.filter(k=>k!=='class');
    for(const k of keys)for(const l of expandValue(k,r.kv[k]))lines.push(l);
  }else{
    lines.push(`▸ ${r.head}`);
    for(const k of r.order)for(const l of expandValue(k,r.kv[k]))lines.push(l);
  }
  return lines;
}
function sideBySide(el,aText,bText,fa,fb){
  // attribute-per-line, JSON-expanded, row-ALIGNED panes: missing fields/records
  // leave blank placeholder rows so both sides compare line-by-line under scroll lock
  const A=parseRecords(aText),B=parseRecords(bText);
  const bUsed=new Set();
  const pairs=[];
  for(const ra of A){
    const k=recKey(ra);
    const j=B.findIndex((rb,idx)=>!bUsed.has(idx)&&recKey(rb)===k);
    if(j>=0){bUsed.add(j);pairs.push([ra,B[j]]);}else pairs.push([ra,null]);
  }
  B.forEach((rb,idx)=>{if(!bUsed.has(idx))pairs.push([null,rb]);});
  const L=[],R=[];let aOnly=0,bOnly=0,diffLines=0;
  const pad=(arr,n)=>{while(arr.length<n)arr.push({t:'',cls:'ph'});};
  for(const[ra,rb]of pairs){
    if(ra&&rb){
      // union of keys in ra order + rb extras → aligned attribute rows
      const keys=[...ra.order.filter(k=>k!=='class')];
      for(const k of (rb.order||[]))if(k!=='class'&&!keys.includes(k))keys.push(k);
      const la=[`▸ ${ra.kv.class!=null?clsName(+ra.kv.class)+' (class='+ra.kv.class+')':ra.head}`];
      const lb=[`▸ ${rb.kv.class!=null?clsName(+rb.kv.class)+' (class='+rb.kv.class+')':rb.head}`];
      for(const k of keys){
        const ea=ra.kv[k]!=null?expandValue(k,ra.kv[k]):null;
        const eb=rb.kv[k]!=null?expandValue(k,rb.kv[k]):null;
        const n=Math.max(ea?ea.length:1,eb?eb.length:1);
        for(let i=0;i<n;i++){
          la.push(ea?(ea[i]!=null?ea[i]:''):'  ·');
          lb.push(eb?(eb[i]!=null?eb[i]:''):'  ·');
        }
      }
      for(let i=0;i<Math.max(la.length,lb.length);i++){
        const ta=la[i]!=null?la[i]:'',tb=lb[i]!=null?lb[i]:'';
        const same=ta===tb||volNorm(ta)===volNorm(tb);
        if(!same)diffLines++;
        L.push({t:ta,cls:same?'':'d'});R.push({t:tb,cls:same?'':'d'});
      }
    }else{
      const rec=ra||rb,lines=recLines(rec);
      if(ra)aOnly++;else bOnly++;
      for(const l of lines){
        L.push(ra?{t:l,cls:'d'}:{t:'',cls:'ph'});
        R.push(rb?{t:l,cls:'d'}:{t:'',cls:'ph'});
      }
    }
    L.push({t:'',cls:''});R.push({t:'',cls:''});
  }
  const rend=arr=>arr.map(x=>x.cls==='d'?`<span class="d">${esc(x.t)||' '}</span>`:(x.cls==='ph'?`<span class="cnt">${x.t||' '}</span>`:esc(x.t)||' ')).join('\n');
  el.classList.remove('note');
  el.innerHTML=`<div class="toolrow"></div><div class="cols">
    <div><div class="cap">${esc(LBLU)}</div><pre>${rend(L)}</pre></div>
    <div><div class="cap">${esc(LBLO)}</div><pre>${rend(R)}</pre></div></div>
  <p class="note">${(diffLines||aOnly||bOnly)?'highlighted = differs or missing on the other side (pid/CAB nondeterminism ignored) · blank rows keep the panes aligned':'no differences beyond pid/CAB nondeterminism'}${(fa||fb)?`<br>up ${esc(fa||'—')}<br>ab ${esc(fb||'—')}`:''}</p>`;
  const pres=el.querySelectorAll('pre');
  linkScroll(pres[0],pres[1],el.querySelector('.toolrow'));
  return{aOnly:aOnly+diffLines,bOnly};
}
const volNorm=s=>normCab(String(s)).replace(/pid ?= ?-?\d+/g,'pid=※');
function smartTokens(line){
  const parts=line.trim().split(/\s+/);const out=[];let buf='',q=0,b=0;
  for(const p of parts){
    buf=buf?buf+' '+p:p;
    for(const c of p){if(c==='"')q^=1;else if(c==='('||c==='[')b++;else if(c===')'||c===']')b=Math.max(0,b-1);}
    if(q===0&&b===0){out.push(buf);buf='';}
  }
  if(buf)out.push(buf);
  return out;
}
function unifiedDiff(aText,bText){
  const clean=t=>t.split('\n').map(s=>s.trimEnd()).filter(s=>s&&!s.startsWith('== '));
  const al=clean(aText),bl=clean(bText);
  const rows=[];let same=0;
  if(al.length===bl.length){
    for(let i=0;i<al.length;i++){
      if(al[i]===bl[i]||volNorm(al[i])===volNorm(bl[i])){same++;continue;}
      const at=smartTokens(al[i]),bt=smartTokens(bl[i]);
      if(at.length===bt.length){
        const parts=at.map((t,j)=>(t===bt[j]||volNorm(t)===volNorm(bt[j]))?esc(t):`<span class="fu">${esc(t)}</span><span class="arr">→</span><span class="fb">${esc(bt[j])}</span>`);
        rows.push(`<div class="uline">${parts.join(' ')}</div>`);
      }else rows.push(`<div class="uline"><span class="fu">up: ${esc(al[i])}</span><br><span class="fb">ab: ${esc(bl[i])}</span></div>`);
    }
  }else{
    const bset=new Set(bl.map(volNorm)),aset=new Set(al.map(volNorm));
    for(const l of al)if(!bset.has(volNorm(l)))rows.push(`<div class="uline"><span class="fu">up-only: ${esc(l)}</span></div>`);
    for(const l of bl)if(!aset.has(volNorm(l)))rows.push(`<div class="uline"><span class="fb">ab-only: ${esc(l)}</span></div>`);
    same=al.filter(l=>bset.has(volNorm(l))).length;
  }
  return{rows,same,total:Math.max(al.length,bl.length)};
}

/* ── structure tree: asset-bundle-shaped diff ─────────────────────────
   pid= and CAB-hashes are NON-DETERMINISTIC by design → normalized out of
   the comparison so only meaningful shape/field differences light up. */
const CLASSNAMES={1:'GameObject',4:'Transform',20:'Camera',21:'Material',23:'MeshRenderer',
 28:'Texture2D',33:'MeshFilter',43:'Mesh',48:'Shader',49:'TextAsset',54:'Rigidbody',
 64:'MeshCollider',65:'BoxCollider',74:'AnimationClip',82:'AudioSource',83:'AudioClip',
 90:'Avatar',91:'AnimatorController',95:'Animator',102:'TextMesh',108:'Light',111:'Animation',
 114:'MonoBehaviour',115:'MonoScript',120:'LineRenderer',128:'Font',135:'SphereCollider',
 136:'CapsuleCollider',137:'SkinnedMeshRenderer',142:'AssetBundle',198:'ParticleSystem',
 199:'ParticleSystemRenderer',205:'LODGroup',212:'SpriteRenderer',213:'Sprite',224:'RectTransform'};
const FMTNAMES={4:'RGBA32',10:'DXT1',12:'DXT5',25:'BC7',26:'BC6H',28:'DXT1Crunched',29:'DXT5Crunched',34:'ETC_RGB4',3:'RGB24',1:'Alpha8'};
const clsName=c=>CLASSNAMES[c]||('class '+c);
const normCab=s=>String(s).replace(/cab-[0-9a-f]{32}/gi,'CAB-…');
function parseObjdump(text){
  const files=[];let cur=null;
  for(const raw of text.split('\n')){
    const line=raw.trim();
    if(!line||line.startsWith('== '))continue;
    let m=line.match(/^serialized file (\S+) objects=(\d+)/);
    if(m){cur={cab:m[1],objects:[]};files.push(cur);continue;}
    m=line.match(/^class=(\d+) pid=(-?\d+) name=(.*)$/);
    if(m&&cur){
      let rest=m[3],name=rest,fields={};
      const fi=rest.search(/ (deps=|container_keys=|script_len=|script_head=)/);
      if(fi>=0){name=rest.slice(0,fi);
        for(const t of smartTokens(rest.slice(fi+1))){const eq=t.indexOf('=');
          if(eq>0)fields[t.slice(0,eq)]=t.slice(eq+1);}}
      cur.objects.push({cls:+m[1],pid:m[2],name,fields});
    }
  }
  return files;
}
function parseTexdump(text){
  const map={};
  for(const raw of text.split('\n')){
    const m=raw.trim().match(/^Texture2D pid=-?\d+ name=(\S+) (.+)$/);
    if(m){const f={};for(const t of m[2].split(/\s+/)){const eq=t.indexOf('=');
      if(eq>0)f[t.slice(0,eq)]=t.slice(eq+1);else if(/^\d+[x×]\d+$/.test(t))f.dims=t.replace('x','×');}
      map[m[1]]=f;}
  }
  return map;
}
function fieldDiffHtml(fa,fb){
  const keys=[...new Set([...Object.keys(fa),...Object.keys(fb)])];
  const parts=[];let changed=0;
  for(const k of keys){
    let va=fa[k],vb=fb[k];
    const na=va==null?null:normCab(va),nb=vb==null?null:normCab(vb);
    if(k==='fmt'&&FMTNAMES[+va])va=va+'('+FMTNAMES[+va]+')';
    if(k==='fmt'&&FMTNAMES[+vb])vb=vb+'('+FMTNAMES[+vb]+')';
    if(na===nb)parts.push(`<span class="cnt">${esc(k)}=${esc(String(va).length>60?String(va).slice(0,57)+'…':va)}</span>`);
    else{changed++;
      parts.push(`${esc(k)}: <span class="fu">${esc(va==null?'—':va)}</span><span class="arr">→</span><span class="fb">${esc(vb==null?'—':vb)}</span>`);}
  }
  return{html:parts.join(' · '),changed};
}

    for(let i=0;i<n;i++){
      const af=A[i]||{cab:'—',objects:[]},bf=B[i]||{cab:'—',objects:[]};
      html+=`<div class="cap" style="margin-top:10px">serialized file <span class="cnt">(up ${af.objects.length} / ab ${bf.objects.length} objects · CAB names are build-nondeterministic)</span></div>`;
      // pinned: AssetBundle manifest + metadata TextAsset
      const parseMeta=f=>{
        const un=s=>String(s||'').replace(/\\"/g,'"');
        const sh=un(f.script_head);const out={};
        const g=re=>{const m=sh.match(re);return m?m[1]:undefined;};
        if(g(/"timestamp":(\d+)/)!==undefined)out.timestamp=g(/"timestamp":(\d+)/);
        if(g(/"version":"([^"]*)"/))out.version=g(/"version":"([^"]*)"/);
        const dep=g(/"dependencies":\[([^\]]*)/);if(dep!==undefined)out.dependencies='['+dep+(sh.includes(']')?']':'…');
        const ma=g(/"mainAsset":"([^"]*)/);if(ma!==undefined)out.mainAsset=ma||'(empty)';
        return out;};
      for(const[label,pick,xform]of[
        ['AssetBundle manifest',o=>o.cls===142,o=>({name:o.name.length>34?o.name.slice(0,31)+'…':o.name,deps:o.fields.deps,container:o.fields.container_keys})],
        ['bundle metadata',o=>o.cls===49&&o.name==='metadata',o=>parseMeta(o.fields)]]){
        const a=af.objects.find(pick),b=bf.objects.find(pick);
        if(!a&&!b)continue;
        const d=fieldDiffHtml(a?xform(a):{},b?xform(b):{});
        totChanged+=d.changed;
        html+=`<div class="pin"><span class="cap">${label}</span> ${d.changed?'<span class="tchg">'+d.changed+' field(s) differ</span> · ':'<span class="tok">✓</span> · '}${d.html}</div>`;
      }
      // class groups: identical groups collapse to ONE line (ink-to-info)
      const rest=o=>!(o.cls===142||(o.cls===49&&o.name==='metadata'));
      const classes=[...new Set([...af.objects.filter(rest).map(o=>o.cls),...bf.objects.filter(rest).map(o=>o.cls)])].sort((x,y)=>x-y);
      html+='<div class="tree">';
      const okGroups=[];
      for(const c of classes){
        const ao=af.objects.filter(o=>o.cls===c&&rest(o)),bo=bf.objects.filter(o=>o.cls===c&&rest(o));
        const names=[...new Set([...ao.map(o=>o.name),...bo.map(o=>o.name)])].sort();
        let rows='',grpChanged=0;
        for(const nm of names){
          const ca=ao.filter(o=>o.name===nm),cb=bo.filter(o=>o.name===nm);
          const label=nm===''?'<i class="cnt">(unnamed)</i>':esc(nm);
          if(ca.length!==cb.length){grpChanged++;
            const cls_=ca.length>cb.length?'tdel':'tadd';totAdd+=Math.max(0,cb.length-ca.length);totDel+=Math.max(0,ca.length-cb.length);
            rows+=`<div class="tnode"><span class="${cls_}">${label} — up ×${ca.length} / ab ×${cb.length}</span></div>`;
          }else if(c===28&&(TA[nm]||TB[nm])){
            const d=fieldDiffHtml(TA[nm]||{},TB[nm]||{});
            if(d.changed){grpChanged++;totChanged+=d.changed;
              rows+=`<div class="tnode"><b>${label}</b> — ${d.html}</div>`;}
          }else{
            const fa1=ca[0]&&ca[0].fields,fb1=cb[0]&&cb[0].fields;
            if(fa1&&fb1&&(Object.keys(fa1).length||Object.keys(fb1).length)){
              const d=fieldDiffHtml(fa1,fb1);
              if(d.changed){grpChanged+=1;totChanged+=d.changed;
                rows+=`<div class="tnode"><b>${label}</b> — ${d.html}</div>`;}
            }
          }
        }
        const countDiff=ao.length!==bo.length;
        if(!grpChanged&&!countDiff){okGroups.push(`${clsName(c)} ×${ao.length}`);continue;}
        html+=`<div class="cap" style="margin-top:6px"><span class="tchg">${clsName(c)} ×${Math.max(ao.length,bo.length)} — ${grpChanged||Math.abs(ao.length-bo.length)} diff</span></div>${rows}`;
      }
      if(okGroups.length)html+=`<div class="tnode"><span class="tok">✓ identical:</span> ${okGroups.join(' · ')}</div>`;
      html+='</div>';
    }
    el.classList.remove('note');
    el.innerHTML=`<p class="usummary">${(totChanged||totAdd||totDel)?`<span class="tchg">${totChanged} field(s) differ</span> · <span class="tdel">${totDel} up-only</span> · <span class="tadd">${totDel?'':''}${totAdd} ab-only</span>`:'<span class="tok">shape identical ✓</span>'}
      · pid values and CAB hashes are build-nondeterministic and excluded from comparison</p>
      ${html}
      <div class="cap" style="margin-top:14px">raw objdump side-by-side</div><div class="rawpanes"></div>
      <p class="note">inspected:<br>up ${esc(fa)}<br>ab ${esc(fb)}</p>`;
    sideBySide(el.querySelector('.rawpanes'),oa,ob,null,null);
    const bad=totChanged+totAdd+totDel;
    chip('ch-struct',bad?'c-diff':'c-ok',bad?`${totChanged}Δ ${totDel}↑ ${totAdd}↓`:'shape ✓');
  }catch(e){el.innerHTML='<p class="note">struct failed: '+esc(e)+'</p>';chip('ch-struct','c-bad','error');}
}
boot();
</script>
</body>
</html>
