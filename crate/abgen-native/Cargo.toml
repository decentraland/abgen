[package]
name = "abgen-native"
version.workspace = true
edition = "2021"
description = "C-ABI shared library export of abgen's conversion pipeline — embeddable in Unity and any native host."
license = "Apache-2.0"
publish = false

[lib]
name = "abgen"
crate-type = ["cdylib", "staticlib"]
doc = false

[[bin]]
name = "abgen-host"
path = "src/bin/abgen-host.rs"

[dependencies]
abgen_core = { path = "..", package = "abgen", default-features = false }
rayon = "1"
serde_json = "1"

[dev-dependencies]
abgen_core = { path = "..", package = "abgen", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
] }
