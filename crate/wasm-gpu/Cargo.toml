[package]
name = "abgen-wasm-gpu"
version = "0.11.3"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[features]

[dependencies]
anyhow = "1"
wgpu = { version = "=30.0.0", default-features = false, features = ["std", "wgsl", "webgpu"] }
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
