[profile.windows-quick]
default-filter = '''
  package(abgen-native)
  + package(dcl-contents)
  + (package(abgen) & kind(lib) & test(/^(abcdn|live|export|jitcache|local_store|texencode_cache|builder|lodgen|clihelp|ffi|worlds)::/))
'''

# Written inside the check derivations; nix/checks.nix asserts a nonzero
# test count from it, making "tests actually ran" part of the drv output
# instead of a post-hoc log grep a substitution could bypass.
[profile.default.junit]
path = "junit.xml"
