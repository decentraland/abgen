name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt
          cache: "false"
      - run: cargo fmt --all -- --check
      - name: forbid node spawns
        run: |
          ! grep -rn 'Command::new("npm\|Command::new("node' crate/src

  sanitizers:
    name: address sanitizer
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: nightly
      RUSTFLAGS: -Zsanitizer=address
      CFLAGS: -fsanitize=address -fno-omit-frame-pointer
      CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: rust-src
      - name: cargo test under ASan
        run: |
          ABGEN_ROOT="$GITHUB_WORKSPACE" cargo test --locked --workspace --lib \
            --target x86_64-unknown-linux-gnu -- --test-threads=1

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/rust-setup
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  check:
    name: test
    strategy:
      matrix:
        # The arm runner is what makes every #[cfg(target_arch = "aarch64")]
        # NEON parity test a merge gate; without it the aarch64 release
        # artifacts ship whatever the NEON kernels happen to produce.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/rust-setup
      - name: install cargo-nextest
        run: |
          arch="$(uname -m)"
          flavor=linux; [ "$arch" = aarch64 ] && flavor=linux-arm
          curl -LsSf "https://get.nexte.st/0.9.143/$flavor" | tar xzf - -C "$HOME/.cargo/bin"
      - run: ABGEN_ROOT="$GITHUB_WORKSPACE" cargo nextest run --locked --workspace
      - run: cargo test --locked -p abgen-lambda
      - run: ABGEN_ROOT="$GITHUB_WORKSPACE" cargo test --locked -p abgen-native --tests

  native-smoke:
    name: C ABI smoke
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/rust-setup
      - name: C ABI smoke test
        run: ABGEN_ROOT="$GITHUB_WORKSPACE" crate/abgen-native/tests/run-smoke.sh
      - name: glibc floor
        run: bash ci/check-glibc-floor.sh 2.34 target/release/libabgen.so target/release/libabgen.a

  windows:
    name: windows lib tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/rust-setup
      - name: install cargo-nextest
        shell: pwsh
        run: curl.exe -LsSf https://get.nexte.st/0.9.143/windows-tar | tar -xzf - -C $env:USERPROFILE\.cargo\bin
      - name: lib tests
        shell: pwsh
        run: |
          $env:ABGEN_ROOT = $env:GITHUB_WORKSPACE
          cargo nextest run --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p abgen-native --tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-smoke:
    name: windows native smoke
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/rust-setup
      - name: native host smoke
        shell: pwsh
        run: |
          cargo build --release -p abgen-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/abgen-smoke.ps1 -Tree $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  node-addon:
    name: node addon
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/rust-setup
      - name: abgen-node (build + smoke)
        working-directory: crate/abgen-node
        run: |
          npm ci --no-audit --no-fund
          npx napi build --platform --release -- --locked
          git diff --exit-code -- index.js index.d.ts \
            || { echo "index.js/index.d.ts are stale; run 'napi build --platform --release' and commit them" >&2; exit 1; }
          node test/smoke.mjs
          # The addon is dlopen'd into node and so is bound by the host's
          # glibc exactly like libabgen.so is by Unity's. Paths are relative to
          # crate/abgen-node now that the step runs there.
          bash ../../ci/check-glibc-floor.sh 2.34 \
            target/release/libabgen_node.so

  nix-ci:
    name: nix checks
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - uses: ./.github/actions/nix-store-cache
        with:
          family: build
      - name: build flake checks
        run: |
          case "$(uname -m)" in
            x86_64)  system=x86_64-linux ;;
            aarch64) system=aarch64-linux ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          bash ci/nix-checks.sh "$system"

  wasm:
    name: wasm32 check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/nix-store-cache
        with:
          family: wasm
      - name: abgen-wasm (wasm32)
        run: |
          cd crate/abgen-wasm
          nix develop "path:$PWD/toolchain" --command \
            env RUSTFLAGS='-C target-feature=+simd128' \
            cargo check --locked --release --target wasm32-unknown-unknown
