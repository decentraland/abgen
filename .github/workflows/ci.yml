name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  check:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable @ 2026-07-08
        with:
          toolchain: "1.97.0"
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      # the toolchain is node-free: the crate must never spawn npm or node
      - name: forbid node spawns
        run: |
          ! grep -rn 'Command::new("npm\|Command::new("node' crate/src
      # --test-threads=1: the lib tests share the ABGEN_ROOT env (lodgen vs emote-template race).
      # --locked matches the Dockerfile build: a Cargo.toml edit without a
      # regenerated Cargo.lock must fail at PR time, not at image-build time.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: ABGEN_ROOT="$GITHUB_WORKSPACE" cargo test --locked --workspace --lib -- --test-threads=1
