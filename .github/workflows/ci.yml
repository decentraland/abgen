name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  RUSTFLAGS: -D warnings

jobs:
  sanitizers:
    name: address sanitizer
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: nightly
      RUSTFLAGS: -Zsanitizer=address
      CFLAGS: -fsanitize=address -fno-omit-frame-pointer
      CXXFLAGS: -fsanitize=address -fno-omit-frame-pointer
      ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/rust-setup
        with:
          toolchain: nightly
          components: rust-src
      - name: cargo test under ASan
        run: |
          ABGEN_ROOT="$GITHUB_WORKSPACE" cargo test --locked --workspace --lib \
            --target x86_64-unknown-linux-gnu -- --test-threads=1

  windows-gate:
    name: windows gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
      hash: ${{ steps.hash.outputs.h }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - id: hash
        uses: ./.github/actions/tree-hash
      - id: memo
        uses: ./.github/actions/artifact-hit
        with:
          name: windows-green-${{ steps.hash.outputs.h }}
      - id: decide
        run: |
          if [ "${{ steps.memo.outputs.hit }}" = "true" ]; then mode=skip
          elif [ "${{ github.event_name }}" != "pull_request" ]; then mode=full
          elif ! git diff --quiet ${{ github.event.pull_request.base.sha }}...HEAD -- 'Cargo.lock' 'Cargo.toml' 'rust-toolchain.toml' '.github/workflows/ci.yml' '.github/actions/rust-setup' 'ci/abgen-smoke.ps1' '.config/nextest.toml' 'crate/Cargo.toml' 'crate/build.rs' 'crate/third_party' 'crate/abgen-native' 'crate/dcl-contents' 'crate/src/abcdn' 'crate/src/builder' 'crate/src/export' 'crate/src/lodgen' 'crate/src/gpu' 'crate/src/live.rs' 'crate/src/jitcache.rs' 'crate/src/local_store.rs' 'crate/src/texencode_cache.rs' 'crate/src/tmppath.rs' 'crate/src/clihelp.rs' 'crate/src/ffi.rs' 'crate/src/worlds.rs' 'crate/src/lods.rs' 'crate/src/lz4.rs' 'crate/src/manifest.rs' 'crate/src/space.rs' 'crate/src/shader.rs' 'crate/src/lib.rs' 'crate/src/gltf/scene_build.rs' 'crate/src/unity/bundle_file.rs' 'crate/abgen-wasm/test/fixtures/normal-quad.glb'; then mode=full
          elif ! git diff --quiet ${{ github.event.pull_request.base.sha }}...HEAD -- '**/*.rs' 'Cargo.*' '**/Cargo.toml'; then mode=quick
          # nothing rust-adjacent in the diff: the tree hash still guards
          # correctness (any relevant change lands in the first branch).
          else mode=skip; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  windows:
    name: windows tests + smoke
    needs: windows-gate
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: needs.windows-gate.outputs.mode != 'skip'
      - uses: ./.github/actions/rust-setup
        if: needs.windows-gate.outputs.mode != 'skip'
      - name: install cargo-nextest
        if: needs.windows-gate.outputs.mode != 'skip'
        shell: pwsh
        run: curl.exe -LsSf https://get.nexte.st/0.9.143/windows-tar | tar -xzf - -C $env:USERPROFILE\.cargo\bin
      - name: skip notice
        if: needs.windows-gate.outputs.mode == 'skip'
        run: echo "windows suite already green for tree ${{ needs.windows-gate.outputs.hash }} (verdict artifact); skipping."
      - name: quick tests + smoke
        if: needs.windows-gate.outputs.mode == 'quick'
        shell: pwsh
        run: |
          $env:ABGEN_ROOT = $env:GITHUB_WORKSPACE
          cargo nextest run --locked -P windows-quick -p abgen -p dcl-contents -p abgen-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build -p abgen-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/abgen-smoke.ps1 -Tree $env:GITHUB_WORKSPACE -Profile debug
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: full tests + smoke
        if: needs.windows-gate.outputs.mode == 'full'
        shell: pwsh
        run: |
          $env:ABGEN_ROOT = $env:GITHUB_WORKSPACE
          cargo nextest run --locked --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --release -p abgen-native
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -ExecutionPolicy Bypass -File ci/abgen-smoke.ps1 -Tree $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: write verdict
        if: needs.windows-gate.outputs.mode == 'full'
        shell: pwsh
        run: Set-Content -Path .win-green -Value green
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: needs.windows-gate.outputs.mode == 'full'
        with:
          name: windows-green-${{ needs.windows-gate.outputs.hash }}
          path: .win-green
          retention-days: 30

  nix-ci:
    name: ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: x86 nextest
            runner: ubuntu-24.04
            system: x86_64-linux
            marker: x86-nextest
            deps: .#checks.x86_64-linux.deps-checkfast
            attrs: nextest
            flavor: checkfast
          - lane: x86 build + smoke
            runner: ubuntu-24.04
            system: x86_64-linux
            marker: x86-smoke
            deps: .#checks.x86_64-linux.deps
            attrs: native-smoke
          - lane: arm nextest
            runner: ubuntu-24.04-arm
            system: aarch64-linux
            marker: arm-nextest
            deps: .#checks.aarch64-linux.deps-checkfast
            attrs: nextest
            flavor: checkfast
          - lane: arm lambda
            runner: ubuntu-24.04-arm
            system: aarch64-linux
            marker: arm-lambda
            deps: .#checks.aarch64-linux.lambda-deps
            attrs: lambda-tests
            # one saver per (os,arch,flavor): sharing checkfast dropped this lane's outputs
            flavor: lambda
          - lane: arm lints + smoke
            runner: ubuntu-24.04-arm
            system: aarch64-linux
            marker: arm-lints
            deps: .#checks.aarch64-linux.deps .#checks.aarch64-linux.wasm-deps
            attrs: clippy fmt no-node-spawn wasm-check native-smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - id: th
        uses: ./.github/actions/tree-hash
        with:
          scope: nix
      - id: memo
        uses: ./.github/actions/artifact-hit
        with:
          name: nix-green-${{ matrix.marker }}-${{ steps.th.outputs.h }}
      - name: skip notice
        if: steps.memo.outputs.hit == 'true'
        run: echo "lane already green for tree ${{ steps.th.outputs.h }} (verdict artifact); skipping."
      - uses: ./.github/actions/nix-store-cache
        if: steps.memo.outputs.hit != 'true'
        with:
          flavor: ${{ matrix.flavor || 'build' }}
      - name: deps (dependency closures)
        if: steps.memo.outputs.hit != 'true'
        run: nix build --no-link ${{ matrix.deps }}
      - name: checks (${{ matrix.attrs }})
        if: steps.memo.outputs.hit != 'true'
        run: bash ci/nix-checks.sh ${{ matrix.system }} ${{ matrix.attrs }}
      # not always(): a cancelled mid-pack save must not own an immutable key
      - uses: ./.github/actions/nix-store-cache/save
        if: success() || failure()
        continue-on-error: true
      - name: write verdict
        if: steps.memo.outputs.hit != 'true'
        run: echo green > .lane-green
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.memo.outputs.hit != 'true'
        with:
          name: nix-green-${{ matrix.marker }}-${{ steps.th.outputs.h }}
          path: .lane-green
          retention-days: 30

  node-addon:
    name: node addon
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - id: hash
        uses: ./.github/actions/tree-hash
      - id: memo
        uses: ./.github/actions/artifact-hit
        with:
          name: node-green-${{ steps.hash.outputs.h }}
      - name: skip notice
        if: steps.memo.outputs.hit == 'true'
        run: echo "node addon already green for tree ${{ steps.hash.outputs.h }} (verdict artifact); skipping."
      - uses: ./.github/actions/rust-setup
        if: steps.memo.outputs.hit != 'true'
        with:
          workspaces: crate/abgen-node
          shared-key: abgen-node
          save-if: "false"
      - name: abgen-node (build + smoke)
        if: steps.memo.outputs.hit != 'true'
        working-directory: crate/abgen-node
        run: |
          npm ci --no-audit --no-fund
          # --cargo-flags, never '-- --locked': napi's positional is a copy destination
          npx napi build --platform --release --cargo-flags=--locked
          ls ./*.node
          git diff --exit-code -- index.js index.d.ts \
            || { echo "index.js/index.d.ts are stale; run 'napi build --platform --release' and commit them" >&2; exit 1; }
          node test/smoke.mjs
          bash ../../ci/check-glibc-floor.sh 2.34 target/release/libabgen_node.so
      - name: write verdict
        if: steps.memo.outputs.hit != 'true'
        run: echo green > .node-green
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: steps.memo.outputs.hit != 'true'
        with:
          name: node-green-${{ steps.hash.outputs.h }}
          path: .node-green
          retention-days: 30
