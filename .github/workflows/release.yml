name: release

# Thin scheduler around ci/build.sh and ci/napi.sh — every build step that
# matters runs identically on a laptop. Derivation: docs/ci.md.
#
# main push  : build everything once as input-addressed artifacts
#              (<kind>-<id>-... — srcId for cargo/napi legs, nixId for nix
#              legs and images); legs whose artifacts already exist for
#              this tree are skipped at matrix-selection time.
# tag push   : wait for the commit's ci verdict, gather the same artifact
#              names (same-repo runs only — the fetch is fork-filtered and
#              the attestation binds what ships to this run), then
#              publish: GitHub release, npm x2, ghcr multi-arch, ECR.
# dispatch   : rehearse (dry_run) or narrow (targets).
# schedule   : nightly reproducibility — rebuild all legs, byte-compare
#              against the stored artifacts, upload nothing.

on:
  push:
    tags: ["v*"]
    branches: [main]
  # Nightly: rebuild every leg and byte-compare against the stored
  # artifacts — reproducibility is tested here, not gated at release.
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and verify everything, publish nothing"
        type: boolean
        default: true
      targets:
        description: "Comma-separated target triples to build (empty = all)"
        type: string
        default: ""
      skip_napi:
        description: "Skip the @dcl/abgen-node matrix"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  SOURCE_DATE_EPOCH: "315532800"
  ABGEN_GIT_REV: ${{ github.sha }}

jobs:
  setup:
    name: build id + matrix
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      src_id: ${{ steps.eval.outputs.src_id }}
      nix_id: ${{ steps.eval.outputs.nix_id }}
      targets: ${{ steps.matrix.outputs.targets }}
      has_targets: ${{ steps.matrix.outputs.has_targets }}
      napi_targets: ${{ steps.matrix.outputs.napi_targets }}
      has_napi: ${{ steps.matrix.outputs.has_napi }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - name: evaluate the artifact ids
        id: eval
        run: |
          set -eu
          # Eval only, no build. srcId keys cargo/napi artifacts and is the
          # id embedded in the binaries; nixId additionally covers the nix
          # plumbing and keys the nix-built archives and images.
          for id in src nix; do
            value="$(nix eval --raw --extra-experimental-features 'nix-command flakes' ".#${id}Id")"
            case "$value" in *[!0-9a-f]*) echo "${id}Id not hex: $value" >&2; exit 1 ;; esac
            [ "${#value}" -eq 12 ] || { echo "${id}Id not 12 chars: $value" >&2; exit 1; }
            echo "${id}Id=$value"
            echo "${id}_id=$value" >> "$GITHUB_OUTPUT"
          done

      - name: select targets not already built for this tree
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.targets }}
          REPRO: ${{ github.event_name == 'schedule' }}
          SKIP_NAPI: ${{ inputs.skip_napi }}
          SRC_ID: ${{ steps.eval.outputs.src_id }}
          NIX_ID: ${{ steps.eval.outputs.nix_id }}
        run: |
          set -eu

          # BUILD_IMAGES couples each nix leg's images to its archives:
          # skipping a leg must mean every artifact it would produce exists.
          all='[
            {"target":"x86_64-unknown-linux-gnu","runner":"ubuntu-24.04","builder":"nix",
             "images":"dockerImage","image_names":["image-docker-amd64"]},
            {"target":"aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm","builder":"nix",
             "images":"dockerImage,lambdaImage","image_names":["image-docker-arm64","image-lambda-arm64"]},
            {"target":"x86_64-pc-windows-gnu","runner":"ubuntu-24.04","builder":"cargo"},
            {"target":"aarch64-pc-windows-gnullvm","runner":"ubuntu-24.04","builder":"cargo"},
            {"target":"aarch64-apple-darwin","runner":"macos-15","builder":"cargo"},
            {"target":"x86_64-apple-darwin","runner":"macos-15","builder":"cargo"}
          ]'
          napi_all='[
            {"target":"x86_64-unknown-linux-gnu","runner":"ubuntu-24.04","cache":"true"},
            {"target":"aarch64-unknown-linux-gnu","runner":"ubuntu-24.04-arm","cache":"true"},
            {"target":"aarch64-apple-darwin","runner":"macos-15"},
            {"target":"x86_64-apple-darwin","runner":"macos-15"},
            {"target":"x86_64-pc-windows-msvc","runner":"windows-2025"}
          ]'

          if [ -n "${WANT:-}" ]; then
            all=$(echo "$all" | jq -c --arg w "$WANT" \
              '($w | split(",") | map(gsub("^\\s+|\\s+$";""))) as $want
               | map(select(.target as $t | $want | index($t))) as $sel
               | if ($sel | length) == 0 then error("no target matched: \($w)") else $sel end')
          fi

          exists() { # artifact name -> 0 if a non-expired one exists
            gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=10" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length' \
              | awk '{s+=$1} END {exit (s > 0) ? 0 : 1}'
          }

          # The nightly repro always rebuilds (that is the point); otherwise
          # skip legs whose artifacts for this exact tree already exist.
          filter_built() { # json kind -> json
            local json="$1" kind="$2" out="[]" entry t id names n
            while read -r entry; do
              t=$(echo "$entry" | jq -r .target)
              # nix legs (and their images) key on nixId; everything else
              # is a pure function of the source and keys on srcId.
              id="$SRC_ID"
              [ "$(echo "$entry" | jq -r '.builder // ""')" = nix ] && id="$NIX_ID"
              names="$kind-$id-$t"
              for n in $(echo "$entry" | jq -r '(.image_names // [])[]'); do
                names="$names ${n/image-/image-$NIX_ID-}"
              done
              have=true
              for n in $names; do
                exists "$n" || { have=false; break; }
              done
              if [ "$have" = true ]; then
                echo "skip $t: artifacts for $id exist" >&2
              else
                out=$(echo "$out" | jq -c --argjson e "$entry" '. + [$e]')
              fi
            done < <(echo "$json" | jq -c '.[]')
            echo "$out"
          }

          if [ "${REPRO:-false}" = "true" ]; then
            # jq -c: the literals above are multi-line, and GITHUB_OUTPUT
            # takes one line per value.
            sel=$(jq -c . <<<"$all"); napi_sel=$(jq -c . <<<"$napi_all")
          else
            sel=$(filter_built "$all" archives)
            napi_sel=$(filter_built "$napi_all" napi)
          fi
          [ "${SKIP_NAPI:-false}" = "true" ] && napi_sel='[]'

          {
            echo "targets=$sel"
            echo "has_targets=$(echo "$sel" | jq 'length > 0')"
            echo "napi_targets=$napi_sel"
            echo "has_napi=$(echo "$napi_sel" | jq 'length > 0')"
          } >> "$GITHUB_OUTPUT"
          echo "build: $(echo "$sel" | jq -r '[.[].target] | join(", ")')"
          echo "napi:  $(echo "$napi_sel" | jq -r '[.[].target] | join(", ")')"

  build:
    name: ${{ matrix.target }}
    needs: setup
    if: needs.setup.outputs.has_targets == 'true'
    # PR-triggered prebuild legs must not inherit the workflow-level
    # contents: write.
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.targets) }}
    env:
      ABGEN_BUILD_ID: ${{ matrix.builder == 'nix' && needs.setup.outputs.nix_id || needs.setup.outputs.src_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - if: matrix.builder == 'nix'
        uses: ./.github/actions/nix-store-cache
      - if: matrix.builder == 'cargo'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ matrix.target }}-1.97.1-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-1.97.1-

      - name: build, gate, package (ci/build.sh)
        env:
          BUILD_IMAGES: ${{ matrix.images || '' }}
        run: bash ci/build.sh ${{ matrix.target }}

      # Nightly: this tree's artifacts already exist — compare instead of
      # upload. Byte inequality on the same tree means the build stopped
      # being reproducible (or the stored artifact was not produced from
      # this tree); either way, red.
      - name: reproducibility compare (nightly)
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          name="archives-${ABGEN_BUILD_ID}-${{ matrix.target }}"
          id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100"             --jq '[.artifacts[] | select(.expired == false and .workflow_run.repository_id != null and .workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.updated_at) | last | .id // empty')"
          [ -n "$id" ] || { echo "no stored artifact $name to compare against — first build of this tree"; exit 0; }
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > /tmp/stored.zip
          mkdir -p /tmp/stored && unzip -qo /tmp/stored.zip -d /tmp/stored
          for f in dist/abgen-*.tar.gz; do
            cmp "$f" "/tmp/stored/$(basename "$f")" || {
              echo "NOT REPRODUCIBLE: $(basename "$f") differs from the stored artifact" >&2
              exit 1
            }
            echo "reproducible: $(basename "$f")"
          done

      - name: upload archives (input-addressed)
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: archives-${{ env.ABGEN_BUILD_ID }}-${{ matrix.target }}
          path: |
            dist/abgen-*.tar.gz
            dist/abgen-*.tar.gz.sha256
            dist/abgen-*.BUILD-INFO.txt
          if-no-files-found: error

      - name: upload docker image (input-addressed)
        if: github.event_name != 'schedule' && contains(matrix.images || '', 'dockerImage')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-${{ needs.setup.outputs.nix_id }}-docker-${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'amd64' || 'arm64' }}
          path: dist/dockerImage-${{ matrix.target }}.tar.gz
          if-no-files-found: error

      - name: upload lambda image (input-addressed)
        if: github.event_name != 'schedule' && contains(matrix.images || '', 'lambdaImage')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: image-${{ needs.setup.outputs.nix_id }}-lambda-arm64
          path: dist/lambdaImage-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  napi:
    name: abgen-node ${{ matrix.target }}
    needs: setup
    if: needs.setup.outputs.has_napi == 'true'
    # PR-triggered prebuild legs must not inherit the workflow-level
    # contents: write.
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.napi_targets) }}
    env:
      ABGEN_BUILD_ID: ${{ needs.setup.outputs.src_id }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: ./.github/actions/rust-setup
        with:
          targets: ${{ matrix.target }}
          # linux legs cache: x86 primes ci's node-addon job (same
          # shared-key); saves only from main, restorable by every PR.
          cache: ${{ matrix.cache || 'false' }}
          workspaces: crate/abgen-node
          shared-key: abgen-node
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - name: build, smoke, gate (ci/napi.sh)
        run: bash ci/napi.sh ${{ matrix.target }}
      - name: reproducibility compare (nightly)
        if: github.event_name == 'schedule'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          name="napi-${{ needs.setup.outputs.src_id }}-${{ matrix.target }}"
          id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=100"             --jq '[.artifacts[] | select(.expired == false and .workflow_run.repository_id != null and .workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.updated_at) | last | .id // empty')"
          [ -n "$id" ] || { echo "no stored artifact $name — first build of this tree"; exit 0; }
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > stored.zip
          mkdir -p stored && unzip -qo stored.zip -d stored
          for f in dist/*.node; do
            cmp "$f" "stored/$(basename "$f")" || {
              echo "NOT REPRODUCIBLE: $(basename "$f") differs from the stored artifact" >&2
              exit 1
            }
            echo "reproducible: $(basename "$f")"
          done
      - if: github.event_name != 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: napi-${{ needs.setup.outputs.src_id }}-${{ matrix.target }}
          path: dist/*.node
          if-no-files-found: error

  # Building races ahead of the test verdict; SHIPPING is what gates on
  # it. A tag's commit already ran ci when it landed on main — this waits
  # for that verdict and fails closed if it is missing or red.
  ci-green:
    name: ci green gate
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    steps:
      - name: wait for the commit's ci verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 40); do
            run="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=1" \
              --jq '"\(.workflow_runs[0].status // "none") \(.workflow_runs[0].conclusion // "")"')"
            status="${run%% *}"; conclusion="${run#* }"
            [ "$conclusion" = "success" ] && exit 0
            if [ "$status" = "completed" ]; then
              echo "ci for $GITHUB_SHA concluded: ${conclusion:-none}" >&2
              exit 1
            fi
            echo "ci for $GITHUB_SHA: $status — waiting"
            sleep 60
          done
          echo "timed out waiting for the ci verdict" >&2
          exit 1

  publish:
    name: publish release + npm
    needs: [setup, build, napi, ci-green]
    runs-on: ubuntu-24.04
    if: >-
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true &&
      needs.ci-green.result == 'success' &&
      needs.build.result != 'failure' && needs.build.result != 'cancelled' &&
      needs.napi.result != 'failure' && needs.napi.result != 'cancelled'
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    env:
      SRC_ID: ${{ needs.setup.outputs.src_id }}
      NIX_ID: ${{ needs.setup.outputs.nix_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: npm install -g npm@^11.5.1

      - name: gather archives for this tree
        run: |
          set -eu
          fetch() { # name dest-dir — newest non-expired artifact by exact name
            local id
            id="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=10" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.created_at) | last | .id // empty' \
              | head -1)"
            test -n "$id" || { echo "no artifact named $1 for this tree" >&2; return 1; }
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > /tmp/a.zip
            unzip -qo /tmp/a.zip -d "$2"
          }
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                   x86_64-pc-windows-gnu aarch64-pc-windows-gnullvm \
                   aarch64-apple-darwin x86_64-apple-darwin; do
            case "$t" in
              *-unknown-linux-gnu) id="$NIX_ID" ;;  # nix-class archives
              *)                   id="$SRC_ID" ;;
            esac
            fetch "archives-$id-$t" dist
          done
          ls -l dist

      # Trust is provenance, not recorded hashes: the artifacts came from
      # same-repo runs (fork-filtered fetch), their sidecar sha256s must
      # self-verify, and the attestation below binds them to this run.
      - name: verify archive set
        run: |
          set -eu
          (cd dist && sha256sum -c ./*.sha256)
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p; /^version = "/q' Cargo.toml)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          }
          archives=(dist/*.tar.gz)
          test "${#archives[@]}" -eq 12
          (cd dist && cat ./*.sha256 > ../SHA256SUMS.txt)
          test "$(wc -l < SHA256SUMS.txt)" -eq 12
          cat SHA256SUMS.txt

      - name: attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: "dist/*.tar.gz"

      - name: create the release
        run: |
          set -eu
          # Everything attaches in one shot: immutable releases freeze
          # assets at publication, and nothing else uploads afterward.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md \
            dist/*.tar.gz SHA256SUMS.txt

      - name: publish the CLI npm wrapper
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: bash npm/publish.sh "${GITHUB_REF_NAME#v}" dist

  napi-publish:
    name: publish @dcl/abgen-node
    needs: [setup, napi, ci-green]
    runs-on: ubuntu-24.04
    if: >-
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true &&
      needs.ci-green.result == 'success' &&
      needs.napi.result != 'failure' && needs.napi.result != 'cancelled'
    permissions:
      contents: write
      id-token: write
      actions: read
    env:
      SRC_ID: ${{ needs.setup.outputs.src_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
      - run: npm install -g npm@^11.5.1
      - name: gather napi artifacts for this tree
        working-directory: crate/abgen-node
        run: |
          set -eu
          i=0
          for t in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu \
                   aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            id="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=napi-$SRC_ID-$t&per_page=10" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.created_at) | last | .id // empty' \
              | head -1)"
            test -n "$id" || { echo "no napi artifact for $t" >&2; exit 1; }
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > /tmp/n.zip
            unzip -qo /tmp/n.zip -d "artifacts/napi-$t"
            i=$((i + 1))
          done
          test "$i" -eq 5
          test "$(find artifacts -name '*.node' | wc -l)" -eq 5
      - name: publish
        working-directory: crate/abgen-node
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm i --no-audit --no-fund
          # napi reads the version from package.json, not the tag;
          # prepublish propagates it to the per-platform manifests.
          npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --ignore-scripts --allow-same-version
          npx napi artifacts --dir artifacts
          ls -R ./npm
          # prepublishOnly runs `napi prepublish` (publishes the platform
          # packages); this publishes @dcl/abgen-node itself.
          npm publish --access public

  ghcr-publish:
    name: push docker images to ghcr
    needs: [setup, build, ci-green]
    runs-on: ubuntu-24.04
    if: >-
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true &&
      needs.ci-green.result == 'success' &&
      needs.build.result != 'failure' && needs.build.result != 'cancelled'
    permissions:
      contents: read
      packages: write
      actions: read
    env:
      NIX_ID: ${{ needs.setup.outputs.nix_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - name: push amd64 + arm64, then the manifest list
        run: |
          set -eu
          for arch in amd64 arm64; do
            id="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=image-$NIX_ID-docker-$arch&per_page=10" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.created_at) | last | .id // empty' \
              | head -1)"
            test -n "$id" || { echo "no docker image artifact for $arch" >&2; exit 1; }
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > i.zip
            unzip -qo i.zip && rm i.zip
            mv dockerImage-*.tar.gz "docker-$arch.tar.gz"
          done
          repo="${GITHUB_REPOSITORY,,}"
          conf="$(mktemp)"
          echo 'unqualified-search-registries = []' > "$conf"
          # skopeo from the flake's locked nixpkgs, not today's registry.
          skopeo() {
            nix run --inputs-from . --extra-experimental-features 'nix-command flakes' \
              nixpkgs#skopeo -- --registries-conf "$conf" --insecure-policy "$@"
          }
          for arch in amd64 arm64; do
            skopeo copy --dest-creds "${{ github.actor }}:${{ github.token }}" \
              "docker-archive:$PWD/docker-$arch.tar.gz" \
              "docker://ghcr.io/${repo}:${GITHUB_REF_NAME}-${arch}"
          done
          for tag in "$GITHUB_REF_NAME" latest; do
            nix run --inputs-from . --extra-experimental-features 'nix-command flakes' \
              nixpkgs#regctl -- index create "ghcr.io/${repo}:${tag}" \
              --ref "ghcr.io/${repo}:${GITHUB_REF_NAME}-amd64" \
              --ref "ghcr.io/${repo}:${GITHUB_REF_NAME}-arm64"
          done
          {
            echo "### abgen container image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`ghcr.io/${repo}:${GITHUB_REF_NAME}\` (multi-arch, and \`:latest\`) |"
            echo "| build | \`nix build .#dockerImage\` — deterministic, pinned \`flake.lock\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  ecr-publish:
    name: push lambda image to ECR
    needs: [setup, build, ci-green]
    # Separate job: `environment` is job-level and gates the credentials.
    if: >-
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/') && inputs.dry_run != true &&
      needs.ci-green.result == 'success' &&
      needs.build.result != 'failure' && needs.build.result != 'cancelled'
    runs-on: ubuntu-24.04-arm
    environment: biz
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      NIX_ID: ${{ needs.setup.outputs.nix_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      - name: fetch image
        run: |
          set -eu
          id="$(gh api --paginate "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=image-$NIX_ID-lambda-arm64&per_page=10" \
            --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.created_at) | last | .id // empty' \
            | head -1)"
          test -n "$id" || { echo "::error::no lambda image artifact to push" >&2; exit 1; }
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > i.zip
          unzip -qo i.zip && rm i.zip
          mv lambdaImage-*.tar.gz image.tar.gz
          {
            echo "REF=${GITHUB_REF_NAME:-dev}"
            echo "IMG_SIZE=$(ls -lh image.tar.gz | awk '{print $5}')"
          } >> "$GITHUB_ENV"
      - name: assume ECR push role (OIDC)
        run: |
          role="${{ vars.ABGEN_LAMBDA_ECR_ROLE_ARN }}"
          region="${{ vars.ABGEN_LAMBDA_AWS_REGION }}"
          test -n "$role" && test -n "$region" || {
            echo "ABGEN_LAMBDA_ECR_ROLE_ARN / ABGEN_LAMBDA_AWS_REGION vars unset" >&2
            exit 1
          }
          token="$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)"
          creds="$(aws sts assume-role-with-web-identity \
            --role-arn "$role" --role-session-name abgen-release \
            --web-identity-token "$token" --duration-seconds 900 \
            --query Credentials --output json)"
          {
            echo "AWS_ACCESS_KEY_ID=$(echo "$creds" | jq -r .AccessKeyId)"
            echo "AWS_SECRET_ACCESS_KEY=$(echo "$creds" | jq -r .SecretAccessKey)"
            echo "AWS_SESSION_TOKEN=$(echo "$creds" | jq -r .SessionToken)"
            echo "AWS_REGION=${region}"
          } >> "$GITHUB_ENV"
      - name: push to ECR
        run: |
          repo="${{ vars.ABGEN_LAMBDA_ECR_REPOSITORY }}"
          password="$(aws ecr get-login-password)"
          conf="$(mktemp)"
          echo 'unqualified-search-registries = []' > "$conf"
          nix run --inputs-from . --extra-experimental-features 'nix-command flakes' \
            nixpkgs#skopeo -- \
            --registries-conf "$conf" --insecure-policy copy \
            --dest-creds "AWS:${password}" \
            "docker-archive:$PWD/image.tar.gz" \
            "docker://${repo}:${REF}"
          digest="$(nix run --inputs-from . --extra-experimental-features 'nix-command flakes' \
            nixpkgs#skopeo -- --registries-conf "$conf" --insecure-policy inspect \
            --creds "AWS:${password}" --format '{{.Digest}}' "docker://${repo}:${REF}")"
          {
            echo "### abgen lambda image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${repo}:${REF}\` |"
            echo "| digest | \`${digest}\` |"
            echo "| size | ${IMG_SIZE} compressed, no base OS |"
            echo "| arch | arm64 (Graviton Lambda) |"
          } >> "$GITHUB_STEP_SUMMARY"
