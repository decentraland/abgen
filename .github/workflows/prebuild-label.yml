name: prebuild label

# Approval is the "this tree is about to land" signal: label the PR so
# release.yml pre-builds its input-addressed artifacts, making the
# post-merge main push find everything already built. The label is also a
# manual escape hatch either way.

on:
  pull_request_review:
    types: [submitted]

permissions:
  pull-requests: write

jobs:
  label:
    if: >-
      github.event.review.state == 'approved' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --add-label prebuild
