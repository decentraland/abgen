name: tree hash
description: >
  Deny-list content hash of the checked-out tree for lane memoization.
  Every tracked file participates except paths that provably cannot affect
  the lane's verdict, each with its argument below. The failure mode of an
  omission here is an unnecessary run, never a false skip — the opposite
  polarity of an allow-list.
inputs:
  scope:
    description: >
      cargo = rustup lanes (windows/node): nix plumbing is irrelevant.
      nix = nix lanes: only prose and recorded manifests are irrelevant.
    default: cargo
  ref:
    description: commit to hash (any commit reachable from the checkout)
    default: HEAD
outputs:
  h:
    description: sha256 over the filtered git tree listing (mode, blob, path)
    value: ${{ steps.h.outputs.h }}
runs:
  using: composite
  steps:
    - id: h
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: |
        if [ "${{ inputs.scope }}" = "cargo" ]; then
          h=$(git ls-tree -r "$REF" | awk -F'\t' '
            $2 !~ /^nix\// &&
            $2 != "flake.nix" && $2 != "flake.lock" &&
            $2 != ".github/workflows/release.yml" &&
            $2 !~ /\.md$/' | sha256sum | cut -c1-64)
        else
          h=$(git ls-tree -r "$REF" | awk -F'\t' '
            $2 != ".github/workflows/release.yml" &&
            $2 !~ /\.md$/' | sha256sum | cut -c1-64)
        fi
        echo "h=$h" >> "$GITHUB_OUTPUT"
