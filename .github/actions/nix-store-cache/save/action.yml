name: publish nix binary cache
description: >
  Copy every store path this job built (the delta over the installer
  baseline recorded at restore) into a fresh file:// binary cache and save
  it under the exact key the restore computed. A no-op when the exact key
  already exists: the cache rotates only when its inputs (lockfiles,
  toolchain, nix files) change, so each key holds exactly one immutable,
  self-contained entry — size never accretes and nothing needs purging
  (superseded keys age out of GitHub's cache on their own).

runs:
  using: composite
  steps:
    - name: pack store delta
      id: pack
      shell: bash
      run: |
        if [ -z "${ABGEN_NIXCACHE_KEY:-}" ] || [ "${ABGEN_NIXCACHE_EXACT:-}" = "true" ]; then
          echo "publish=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        nix path-info --all | LC_ALL=C sort > /var/tmp/abgen-nix-now.txt
        comm -13 /var/tmp/abgen-nix-base.txt /var/tmp/abgen-nix-now.txt \
          > /var/tmp/abgen-nix-all-delta.txt
        # Drop everything cache.nixos.org serves (it carries signatures;
        # our unsigned nars and locally-built paths do not): those paths
        # re-download faster from upstream than from our cache, and
        # carrying them tripled the entry size — which is what thrashed
        # the 10 GB pool. Locally-built and our-cache-substituted paths
        # stay, keeping each entry self-contained.
        # unsigned paths only: cache.nixos.org's signed closure re-fetches faster upstream
        nix path-info --all --json \
          | jq -r 'if type == "object" then to_entries[] | select((.value.signatures // []) | length == 0) | .key else .[] | select((.signatures // []) | length == 0) | .path end' \
          | LC_ALL=C sort > /var/tmp/abgen-nix-local.txt
        comm -12 /var/tmp/abgen-nix-all-delta.txt /var/tmp/abgen-nix-local.txt \
          > /var/tmp/abgen-nix-delta.txt
        if ! [ -s /var/tmp/abgen-nix-delta.txt ]; then
          echo "publish=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        xargs -a /var/tmp/abgen-nix-delta.txt \
          nix copy --to 'file:///var/tmp/abgen-nixcache-out?compression=zstd'
        echo "cache: $(wc -l < /var/tmp/abgen-nix-delta.txt) paths," \
          "$(du -sh /var/tmp/abgen-nixcache-out | cut -f1)"
        # actions/cache versions an entry by its path: saving a different
        # directory than the restore looks up makes every save invisible to
        # every restore. Pack fresh for hygiene, then swap into the restore
        # path so both sides share one cache version. The fresh dir is a
        # superset of everything this run substituted, so the substituter
        # keeps working for the rest of the job.
        # actions/cache versions by path: publish the exact path restore uses
        rm -rf /var/tmp/abgen-nixcache
        mv /var/tmp/abgen-nixcache-out /var/tmp/abgen-nixcache
        echo "publish=true" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: steps.pack.outputs.publish == 'true'
      with:
        path: /var/tmp/abgen-nixcache
        key: ${{ env.ABGEN_NIXCACHE_KEY }}

    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      if: steps.pack.outputs.publish == 'true' && env.ABGEN_NIXCACHE_ARTIFACT != 'hit'
      with:
        name: ${{ env.ABGEN_NIXCACHE_KEY }}
        path: /var/tmp/abgen-nixcache
        retention-days: 7
