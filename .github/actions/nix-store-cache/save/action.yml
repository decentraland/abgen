name: publish nix binary cache
description: >
  Copy every store path this job built (the delta over the installer
  baseline recorded at restore) into a fresh file:// binary cache and save
  it under the exact key the restore computed. A no-op when the exact key
  already exists: the cache rotates only when its inputs (lockfiles,
  toolchain, nix files) change, so each key holds exactly one immutable,
  self-contained entry — size never accretes and nothing needs purging
  (superseded keys age out of GitHub's cache on their own).

runs:
  using: composite
  steps:
    - name: pack store delta
      id: pack
      shell: bash
      run: |
        if [ -z "${ABGEN_NIXCACHE_KEY:-}" ] || [ "${ABGEN_NIXCACHE_EXACT:-}" = "true" ]; then
          echo "publish=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        nix path-info --all | LC_ALL=C sort > /var/tmp/abgen-nix-now.txt
        comm -13 /var/tmp/abgen-nix-base.txt /var/tmp/abgen-nix-now.txt \
          > /var/tmp/abgen-nix-delta.txt
        if ! [ -s /var/tmp/abgen-nix-delta.txt ]; then
          echo "publish=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        xargs -a /var/tmp/abgen-nix-delta.txt \
          nix copy --to 'file:///var/tmp/abgen-nixcache-out?compression=zstd'
        echo "cache: $(wc -l < /var/tmp/abgen-nix-delta.txt) paths," \
          "$(du -sh /var/tmp/abgen-nixcache-out | cut -f1)"
        echo "publish=true" >> "$GITHUB_OUTPUT"

    - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      if: steps.pack.outputs.publish == 'true'
      with:
        path: /var/tmp/abgen-nixcache-out
        key: ${{ env.ABGEN_NIXCACHE_KEY }}
