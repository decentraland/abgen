name: nix + binary cache
description: >
  Install nix and wire a content-addressed file:// binary cache, restored
  from the Actions cache, as a substituter. Unlike the old /nix snapshot,
  nothing here is trusted: nix hash-verifies every path it pulls from the
  cache and rebuilds anything missing or corrupt, so a damaged, torn or
  stale entry can cost minutes — never a red job. There is no store DB and
  no eval cache in the artifact, which removes every past poisoning mode at
  the design level. Jobs that should publish the cache end with the sibling
  save action. runner.arch is part of the key so x86_64 and aarch64 stores
  never cross.

inputs:
  flavor:
    description: >
      Which deps closure this job consumes (build = release-profile deps;
      checkfast = the test-lane profile). Separate entries per flavor keep
      the first-save-wins race from caching one flavor's closure under the
      other's key.
    default: build

runs:
  using: composite
  steps:
    - name: prepare empty binary cache
      shell: bash
      run: |
        mkdir -p /var/tmp/abgen-nixcache
        # A dir without nix-cache-info is not a valid binary cache; Priority
        # 10 beats cache.nixos.org (40) so local nars win the substituter
        # race.
        [ -f /var/tmp/abgen-nixcache/nix-cache-info ] ||
          printf 'StoreDir: /nix/store\nPriority: 10\n' \
            > /var/tmp/abgen-nixcache/nix-cache-info

    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
      with:
        # No FlakeHub: with determinate left on, jobs holding an OIDC token
        # (the ECR image job) try a FlakeHub login and warn on every run.
        determinate: false
        extra-conf: |
          max-jobs = auto
          cores = 0
          extra-substituters = file:///var/tmp/abgen-nixcache
          # Our nars are unsigned (produced by this repo's own CI, the same
          # trust domain as the code). Integrity still holds: nix checks
          # every NAR against its narinfo hash before use.
          require-sigs = false

    - name: record installer store baseline
      shell: bash
      # Everything present now came from the installer; the save action
      # publishes only the delta beyond this, so the nix closure itself is
      # never cached.
      run: nix path-info --all | LC_ALL=C sort > /var/tmp/abgen-nix-base.txt

    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: restore
      with:
        path: /var/tmp/abgen-nixcache
        key: nix-v4-${{ runner.os }}-${{ runner.arch }}-${{ inputs.flavor }}-${{ hashFiles('flake.lock', 'Cargo.lock', '**/Cargo.toml', 'flake.nix', 'rust-toolchain.toml', 'nix/*.nix', 'crate/abgen-wasm/toolchain/flake.lock', 'crate/abgen-wasm/toolchain/flake.nix') }}
        restore-keys: nix-v4-${{ runner.os }}-${{ runner.arch }}-${{ inputs.flavor }}-

    - name: expose cache facts to the save action
      shell: bash
      run: |
        {
          echo "ABGEN_NIXCACHE_KEY=${{ steps.restore.outputs.cache-primary-key }}"
          echo "ABGEN_NIXCACHE_EXACT=${{ steps.restore.outputs.cache-hit }}"
        } >> "$GITHUB_ENV"
