name: rust setup
description: >
  Toolchain + cargo cache prelude shared by every rust job. Single source of
  the pinned toolchain version and the cache prefix. Must run after
  actions/checkout (a local action cannot resolve before the repo exists).

inputs:
  toolchain:
    description: Rust toolchain (the repo pin unless a job needs nightly)
    default: "1.97.1"
  components:
    description: Extra rustup components (comma-separated)
    default: ""
  targets:
    description: Extra compilation targets (comma-separated)
    default: ""
  cache:
    description: Restore/save the cargo cache (Swatinem/rust-cache)
    default: "true"
  workspaces:
    description: rust-cache workspaces ("path" or "path -> target", one per line)
    default: "."
  shared-key:
    description: >
      rust-cache shared-key. Set the SAME value in jobs that must share a
      cache (rust-cache otherwise scopes keys by job id, so a producer job's
      save is invisible to a consumer job without this).
    default: ""
  save-if:
    description: rust-cache save-if (set false for pure cache consumers)
    default: "true"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7
      with:
        prefix-key: v0-rust
        workspaces: ${{ inputs.workspaces }}
        shared-key: ${{ inputs.shared-key }}
        save-if: ${{ inputs.save-if }}
